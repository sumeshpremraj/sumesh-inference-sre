# Reference only: replace registry.example.com image digest and probe paths for the real image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-v1
  namespace: inference
  labels: {app: fraud, version: v1}
spec:
  # Intentionally NO spec.replicas: KEDA/HPA owns replica count.
  selector:
    matchLabels: {app: fraud, version: v1}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: fraud, version: v1}
    spec:
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: fraud, version: v1}
      containers:
        - name: model
          image: registry.example.com/models/fraud@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: fraud-v1-svc, namespace: inference}
spec:
  selector: {app: fraud, version: v1}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: fraud-v1-scale, namespace: inference}
spec:
  scaleTargetRef: {name: fraud-v1}
  pollingInterval: 15
  minReplicaCount: 2
  maxReplicaCount: 20
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: {stabilizationWindowSeconds: 300}
  triggers:
    - type: prometheus
      metricType: AverageValue  # aggregate routed RPS / replicas
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        query: 'sum(rate(inference_routed_requests_total{model="fraud",version="v1"}[2m])) or vector(0)'
        threshold: "20"
